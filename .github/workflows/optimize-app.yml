name: Optimize And Rebrand

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to apply the changes to'
        required: false
        default: 'fix/stable'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Report the current size drivers
        run: |
          set -euo pipefail
          echo "--- bundled aars ---"
          du -sh app/libs/* 2>/dev/null || true
          echo "--- fonts ---"
          ls app/src/main/assets/fonts 2>/dev/null || echo "(none)"
          echo "--- locales present ---"
          ls -d app/src/main/res/values-* 2>/dev/null | head -12 || echo "(none)"
          echo "--- current version ---"
          grep -E "versionName|versionCode|applicationId" app/build.gradle | head -3

      - name: Shrink the APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # Every ABI Android supports is packaged into one fat APK. Real phones
          # only ever run two of them, so the rest is dead weight.
          if "abiFilters" in s:
              print("abiFilters already present")
          else:
              anchor = "        multiDexEnabled true"
              if anchor not in s:
                  raise SystemExit("ERROR: insertion point not found")
              s = s.replace(
                  anchor,
                  anchor + "\n"
                  "        // Real phones use these two; the emulator ABIs are dead weight.\n"
                  "        ndk {\n"
                  "            abiFilters 'armeabi-v7a', 'arm64-v8a'\n"
                  "        }",
                  1)
              p.write_text(s, encoding="utf-8")
              print("added abiFilters")
          PY
          grep -n -A3 "abiFilters" app/build.gradle | head -6

      - name: Drop the unsupported locale filter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # AGP 3.5 has no setter for resourceConfigurations; a line left there
          # by an earlier pass breaks evaluation of the whole project.
          before = s
          s = re.sub(r"^[ \t]*//[^\n]*every other locale[^\n]*\n", "", s, flags=re.M)
          s = re.sub(r"^[ \t]*resourceConfigurations[^\n]*\n", "", s, flags=re.M)
          if s != before:
              p.write_text(s, encoding="utf-8")
              print("removed the unsupported resourceConfigurations line")
          else:
              print("no locale filter present")
          PY
          grep -n "resourceConfigurations" app/build.gradle || echo "  (none)"

      - name: Point the app at the opss backend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          BASE = "https://taxi.ecardo.ir/"

          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          if "SERVER_BASE_URL" not in s:
              block = (
                  "        // Single source of truth for the backend address. Override per build\n"
                  "        // with -PSERVER_BASE_URL=https://host/ on the command line.\n"
                  '        buildConfigField "String", "SERVER_BASE_URL", "\\""'
                  ' + (SERVER_BASE_URL ?: "' + BASE + '") + "\\""\n'
                  '        buildConfigField "String", "API_BASE_URL", "\\""'
                  ' + (SERVER_BASE_URL ?: "' + BASE + '") + "webservice_shark.php\\""\n'
              )
              anchor = "        multiDexEnabled true"
              if anchor not in s:
                  raise SystemExit("ERROR: no insertion point in app/build.gradle")
              s = s.replace(anchor, block + anchor, 1)

              s = s.replace(
                  "android {",
                  "// Override from the CLI: ./gradlew assembleProdDebug -PSERVER_BASE_URL=https://host/\n"
                  "ext.SERVER_BASE_URL = project.findProperty('SERVER_BASE_URL')\n\n"
                  "android {",
                  1)
              p.write_text(s, encoding="utf-8")
              print("added SERVER_BASE_URL")
          else:
              print("SERVER_BASE_URL already present")
          PY
          grep -n "SERVER_BASE_URL\|API_BASE_URL" app/build.gradle | head -4

      - name: Rename the app to opss
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          strings = pathlib.Path("app/src/main/res/values/strings.xml")
          s = strings.read_text(encoding="utf-8")
          m = re.search(r'<string name="app_name"[^>]*>([^<]*)</string>', s)
          if m and m.group(1).strip() != "opss":
              s = s.replace(m.group(0), '<string name="app_name">opss</string>', 1)
              strings.write_text(s, encoding="utf-8")
              print("app_name: %s -> opss" % m.group(1))
          else:
              print("app_name already opss or missing")
          PY
          grep -n 'name="app_name"' app/src/main/res/values/strings.xml

      - name: Add the Persian locale
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/values-fa
          python3 - <<'PY'
          import pathlib, re

          base = pathlib.Path("app/src/main/res/values/strings.xml")
          names = re.findall(r'<string name="([^"]+)"', base.read_text(encoding="utf-8"))
          print("base strings: %d" % len(names))

          # Only ship what we can translate correctly; everything else falls back
          # to the default locale rather than shipping broken placeholders.
          pathlib.Path("app/src/main/res/values-fa/strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <string name="app_name">opss</string>\n'
              '</resources>\n',
              encoding="utf-8")
          print("wrote values-fa/strings.xml")
          PY
          cat app/src/main/res/values-fa/strings.xml

      - name: Enable right-to-left layout support
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          p = pathlib.Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          if 'android:supportsRtl="true"' in s:
              print("supportsRtl already true")
          else:
              if "android:supportsRtl" in s:
                  s = re.sub(r'android:supportsRtl="[^"]*"', 'android:supportsRtl="true"', s)
              else:
                  s = re.sub(r"(<application\b)", r'\1 android:supportsRtl="true"', s, count=1)
              p.write_text(s, encoding="utf-8")
              print("set supportsRtl=true")
          PY
          grep -o 'android:supportsRtl="[^"]*"' app/src/main/AndroidManifest.xml | head -1

      - name: Verify the build still configures
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew help --no-daemon > /tmp/help.log 2>&1 || {
            echo "configure failed:"; tail -30 /tmp/help.log; exit 1; }
          echo "build script parses cleanly"

      - name: Commit
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "perf(android): shrink the APK, target the opss backend, add the Persian locale"
          BRANCH="${{ inputs.branch }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH" 2>/dev/null; then
              echo "pushed to $BRANCH"; break
            fi
            git pull --rebase --autostash origin "$BRANCH"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done