name: Fix AndroidX Manifest Conflict

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to patch'
        required: false
        default: 'fix/stable'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Exclude legacy support-library transitives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          old = ("    configurations {\n"
                 "        all*.exclude group: 'com.squareup.okhttp', module: 'okhttp'\n"
                 "        all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp'\n"
                 "    }")
          new = ("    configurations {\n"
                 "        all*.exclude group: 'com.squareup.okhttp', module: 'okhttp'\n"
                 "        all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp'\n"
                 "        // Legacy support-library transitives collide with AndroidX.\n"
                 "        all*.exclude group: 'com.android.support'\n"
                 "    }")

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("excluded com.android.support")
          elif "all*.exclude group: 'com.android.support'" in s:
              print("already excluded")
          else:
              print("WARNING: configurations block not in the expected shape")
          PY

          # The one remaining com.android.support artifact.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace("implementation 'com.android.support:support-dynamic-animation:25.3.0'",
                        "implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'")
          p.write_text(s, encoding="utf-8")
          PY
          # `set -e` turns a non-matching grep into a step failure.
          grep -n "com.android.support" app/build.gradle || echo "no com.android.support left"

      - name: Resolve the manifest collision
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          import xml.etree.ElementTree as ET

          p = pathlib.Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          if "xmlns:tools=" not in s:
              s = s.replace("<manifest",
                            '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
              print("added the tools namespace")

          start = s.find("<application")
          end = s.index(">", start)
          tag = s[start:end + 1]

          values, seen = [], set()
          for v in re.findall(r'tools:replace="([^"]*)"', tag):
              for part in v.split(","):
                  part = part.strip()
                  if part and part not in seen:
                      seen.add(part)
                      values.append(part)

          has_factory = re.search(r'android:appComponentFactory\s*=\s*"', tag) is not None
          needs_replace = any("appComponentFactory" in v for v in values)
          if needs_replace and not has_factory:
              values.append("android:appComponentFactory")
          if not needs_replace:
              values.append("android:appComponentFactory")

          stripped = re.sub(r'\s*tools:replace="[^"]*"', "", tag)
          at = stripped.index(">")
          new_tag = (stripped[:at].rstrip() +
                     '\n        android:appComponentFactory="androidx.core.app.CoreComponentFactory"' +
                     '\n        tools:replace="' + ",".join(values) + '">')
          s = s[:start] + new_tag + s[end + 1:]

          p.write_text(s, encoding="utf-8")
          ET.fromstring(s)
          print("manifest patched and parses cleanly")
          print("tools:replace =", values)
          PY
          # A non-matching grep under `set -e` would abort the step, so allow it.
          awk '/<application/,/\>/' app/src/main/AndroidManifest.xml | \
            grep -E "appComponentFactory|tools:replace" || true

      - name: Verify the build script parses
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew help --no-daemon > /tmp/help.log 2>&1 || {
            echo "configure failed:"; tail -30 /tmp/help.log; exit 1; }
          echo "build script parses cleanly"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/AndroidManifest.xml
          git diff --cached --quiet || git commit -m "fix(ci): exclude legacy support transitives and resolve the manifest conflict"
          BRANCH="${{ inputs.branch }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH" 2>/dev/null; then
              echo "pushed to $BRANCH"; break
            fi
            git pull --rebase --autostash origin "$BRANCH"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done