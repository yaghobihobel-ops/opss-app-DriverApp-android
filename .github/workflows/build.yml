name: Build and Release

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build (defaults to the one that owns the workflow)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: opss-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.bump.outputs.name }}
      version_code: ${{ steps.bump.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up JDK 17 for the SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          # sdkmanager is compiled for Java 17, so it must not run under the
          # JDK 11 that Gradle needs.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          NDK=$(grep -oP "ndkVersion\s+'\K[^']+" app/build.gradle | head -1 || true)
          if [ -n "${NDK:-}" ]; then
            echo "Installing ndk;$NDK"
            for attempt in 1 2 3; do
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" 2>&1 | tail -3 || true
              if [ -d "$ANDROID_HOME/ndk/$NDK" ]; then
                echo "NDK $NDK installed"; break
              fi
              echo "install attempt $attempt failed"
              sleep 10
            done
          fi

          echo "NDK present:"; ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          if [ -n "${NDK:-}" ] && [ ! -d "$ANDROID_HOME/ndk/$NDK" ]; then
            echo "::error::NDK $NDK could not be installed; image ships: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build prod debug APK
        run: |
          set -euo pipefail
          # The vendor zip lost the executable bit on gradlew.
          chmod +x gradlew
          # Skip configuration-time work we do not need and keep the daemon off
          # so a failed build does not leak a JVM into the next step.
          ./gradlew assembleProdDebug --no-daemon --stacktrace \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true

      - name: Collect APK and read its badging
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "ERROR: no APK produced"; exit 1; }

          NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          NAME=${NAME// /}
          cp "$APK" "dist/opss-${{ vars.APP_SLUG || 'passenger' }}-$NAME.apk"
          ls -la dist

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          echo "--- unzip integrity ---"
          unzip -t "dist/"*.apk | tail -2

          echo "--- signature ---"
          "$ANDROID_HOME/build-tools/31.0.0/apksigner" verify --print-certs "dist/"*.apk || \
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "dist/"*.apk || \
            echo "apksigner unavailable"

          echo "--- badging ---"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort | tail -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "dist/"*.apk | \
              grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|native-code|application-label" || true
          else
            echo "aapt not available; skipping badging"
          fi
          unzip -l "dist/"*.apk | grep "lib/" | awk -F/ '{print $2}' | sort -u

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opss-${{ vars.APP_SLUG || 'passenger' }}-${{ steps.apk.outputs.name }}
          path: dist/*.apk
          retention-days: 30

      - name: Write step summary
        run: |
          {
            echo "### Build summary"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- APK: \`opss-${{ vars.APP_SLUG || 'passenger' }}-${{ steps.apk.outputs.name }}.apk\`"
            echo "- APK size: $(du -h dist/*.apk | cut -f1)"
            echo "- ABIs: $(unzip -l dist/*.apk | grep -o 'lib/[a-z0-9_-]*' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Smoke test on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up Java for the emulator tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the APK from the build job
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: opss-${{ vars.APP_SLUG || 'passenger' }}-*
          merge-multiple: true

      - name: Confirm the APK arrived
        run: |
          set -euo pipefail
          ls -la dist
          test -n "$(find dist -name '*.apk' | head -1)" || { echo "ERROR: no APK downloaded"; exit 1; }

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the emulator and launch the app
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          # Do not fail the run when the emulator cannot start; the step below
          # reports the real outcome instead of faking a pass.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            # This runs under /usr/bin/sh (dash), which has no `set -o pipefail`.
            set -eu
            APK=$(find dist -name '*.apk' | head -1)
            echo "APK: $APK"
            adb install -r "$APK"

            # aapt is not on PATH inside the emulator action; resolve it.
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort | tail -1)
            echo "aapt: ${AAPT:-<not found>}"
            test -n "$AAPT" || { echo "ERROR: aapt not found under $ANDROID_HOME/build-tools"; exit 1; }

            PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            ACT=$("$AAPT" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")
            test -n "$PKG" || { echo "ERROR: could not read the package name"; exit 1; }
            echo "package=$PKG launchable=${ACT:-<none>}"
            adb logcat -c
            adb shell am start -n "$PKG/$ACT" || adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell pidof "$PKG" > /dev/null && echo "PROCESS_ALIVE=yes" || echo "PROCESS_ALIVE=no"
            adb exec-out screencap -p > smoke-screenshot.png
            adb logcat -d > smoke-logcat.txt
            echo "--- crash scan ---"
            if grep -E "FATAL EXCEPTION|ANR in" smoke-logcat.txt | grep "$PKG"; then
              echo "SMOKE_FAILED=crash"; exit 1
            fi
            echo "SMOKE_FAILED=no"
            echo "--- startup errors ---"
            grep -iE "E/AndroidRuntime|FirebaseInitProvider.*failed|Maps.*API key|Authorization failure" smoke-logcat.txt | head -10 || true

      - name: Report the real smoke test outcome
        if: always()
        run: |
          set -euo pipefail
          RESULT="${{ steps.emulator.outcome }}"
          echo "emulator step outcome: ${RESULT:-not-run}"
          {
            echo "### Smoke test"
            echo ""
            if [ "${RESULT}" = "success" ]; then
              echo "- Emulator ran and the script completed. See the logcat artifact for crash scanning."
            else
              echo "- **NOT VERIFIED**: the emulator step did not complete (outcome: ${RESULT:-unknown})."
              echo "  This runner image did not give a usable emulator, so runtime behaviour"
              echo "  is still unproven. It needs a real device or a working emulator."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ github.run_id }}
          path: |
            smoke-logcat.txt
            smoke-screenshot.png
          retention-days: 14
          if-no-files-found: warn

  runtime-logs:
    name: Install on a device and capture the runtime logs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: opss-${{ vars.APP_SLUG || 'passenger' }}-*
          merge-multiple: true

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and capture the logs
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            # This runs under /usr/bin/sh (dash), which has no `set -o pipefail`.
            set -eu
            APK=$(find dist -name '*.apk' | head -1)
            echo "APK: $APK"
            adb install -r -d "$APK" 2>&1 | tee install-result.txt

            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort | tail -1)
            PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            ACT=$("$AAPT" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")
            echo "package=$PKG launchable=${ACT:-<none>}"
            echo "$PKG" > package.txt

            adb logcat -c
            if [ -n "${ACT:-}" ]; then
              adb shell am start -n "$PKG/$ACT" || adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            else
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            fi
            sleep 45

            echo "--- process state ---"
            adb shell pidof "$PKG" > /dev/null && echo "ALIVE=yes" || echo "ALIVE=no"
            echo "--- crash markers ---"
            adb logcat -d > runtime-logcat.txt
            grep -E "FATAL EXCEPTION|ANR in|Force finishing" runtime-logcat.txt | head -20 || echo "(no crashes)"
            echo "--- app-specific log lines ---"
            grep -E "$PKG|alaadcin|opss|SocketCluster|Firebase|Google.*API.*key" runtime-logcat.txt | tail -60 > app-lines.txt || true
            cat app-lines.txt
            echo "--- crashes inside this package ---"
            if grep -E "FATAL EXCEPTION" runtime-logcat.txt | grep -q "$PKG"; then
              echo "APP_CRASH=yes"; exit 1
            fi
            echo "APP_CRASH=no"

            adb exec-out screencap -p > runtime-screenshot.png || true

      - name: Summarise what the logs show
        if: always()
        run: |
          set -uo pipefail
          mkdir -p logs
          cp -f runtime-logcat.txt logs/ 2>/dev/null || true
          cp -f app-lines.txt logs/ 2>/dev/null || true
          cp -f install-result.txt logs/ 2>/dev/null || true
          cp -f runtime-screenshot.png logs/ 2>/dev/null || true
          ls -la logs/

          {
            echo "### Runtime logs"
            echo ""
            echo "- Emulator step outcome: ${{ steps.run.outcome }}"
            echo ""
            echo '```'
            head -60 logs/app-lines.txt 2>/dev/null || echo "(no app log lines captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the logs as an artifact and on the release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-${{ vars.APP_SLUG || 'passenger' }}-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Attach the logs to the matching release
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1 | tr -d ' ')
          TAG="v$VERSION"
          gh release view "$TAG" > /dev/null 2>&1 || { echo "no release $TAG yet"; exit 0; }
          if [ -s logs/runtime-logcat.txt ]; then
            gh release upload "$TAG" logs/runtime-logcat.txt \
              --clobber || echo "could not attach the log"
            echo "attached runtime-logcat.txt to $TAG"
          fi

  release:
    name: Bump version and publish release
    needs: [ build, smoke-test, runtime-logs ]
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Needed so the release job can download the APK artifact this run produced.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java for the release tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bump the patch version
        id: bump
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle
          CURRENT_NAME=$(grep -oP 'versionName\s+"\K[^"]+' "$GRADLE" | head -1 | tr -d ' ')
          CURRENT_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' "$GRADLE" | head -1)

          MAJ=$(echo "$CURRENT_NAME" | cut -d. -f1)
          MIN=$(echo "$CURRENT_NAME" | cut -d. -f2)
          PAT=$(echo "$CURRENT_NAME" | cut -d. -f3); PAT=${PAT:-0}
          NEXT="$MAJ.$MIN.$((PAT + 1))"
          NEXT_CODE=$((CURRENT_CODE + 1))

          echo "current: $CURRENT_NAME (code $CURRENT_CODE) -> next: $NEXT (code $NEXT_CODE)"
          sed -i -E "s/(versionName\s+\")[^\"]+(\")/\1$NEXT\2/" "$GRADLE"
          sed -i -E "s/(versionCode\s+)[0-9]+/\1$NEXT_CODE/" "$GRADLE"

          echo "name=$NEXT" >> "$GITHUB_OUTPUT"
          echo "code=$NEXT_CODE" >> "$GITHUB_OUTPUT"

      - name: Commit the bump without retriggering this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore(release): bump to ${{ steps.bump.outputs.name }} (versionCode ${{ steps.bump.outputs.code }}) [skip ci]"
          git push origin HEAD:main

      - name: Download the APK from this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for attempt in 1 2 3; do
            if gh run download "${{ github.run_id }}" -D dist \
                 --pattern "opss-${{ vars.APP_SLUG || 'passenger' }}-*" 2>/dev/null; then
              break
            fi
            echo "download attempt $attempt failed, retrying"
            sleep 15
          done
          APK=$(find dist -name '*.apk' | head -1)
          test -n "$APK" || { echo "ERROR: APK not found in the run artifacts"; exit 1; }
          echo "APK: $APK"

      - name: Publish the APK to the matching release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          APK=$(find dist -name '*.apk' | head -1)
          test -n "$APK" || { echo "ERROR: no APK to publish"; exit 1; }

          NAME="opss-${{ vars.APP_SLUG || 'passenger' }}-$VERSION.apk"

          # A debug build is signed with the throwaway Android debug key, so it
          # will not install over an existing build signed with the vendor key.
          # Document that on the release page instead of failing silently.
          {
            echo "**Version $VERSION** (versionCode ${{ steps.bump.outputs.code }})"
            echo ""
            echo "> **Install note:** this is a *debug* build, signed with the standard"
            echo "> Android debug key. If it will not install on your phone, uninstall the"
            echo "> previously installed copy first — Android refuses to replace an app"
            echo "> signed with a different key. Debug builds also point at a placeholder"
            echo "> Firebase project, so login and push will not work yet."
            echo ""
            echo "### What changed and why"
            echo ""
            git log "${{ github.event.before }}..${{ github.sha }}" --pretty='- %s (%h)' | head -30 || echo "- (initial)"
            echo ""
            echo "### Files changed"
            echo ""
            git diff --name-only "${{ github.event.before }}..${{ github.sha }}" | head -40 || true
            echo ""
            echo "---"
            echo "Built from \`main\` at \`${{ github.sha }}\`."
          } > notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "opss ${{ vars.APP_SLUG || 'passenger' }} $TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$APK" --title "opss ${{ vars.APP_SLUG || 'passenger' }} $TAG" --notes-file notes.md
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Summary
        run: |
          {
            echo "### Release published"
            echo ""
            echo "- Tag: \`v${{ steps.bump.outputs.name }}\`"
            echo "- Asset: \`opss-${{ vars.APP_SLUG || 'passenger' }}-${{ steps.bump.outputs.name }}.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"