name: Check APK zip layout

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          set -x
          TAG=$(curl -sS https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          URL=$(curl -sS https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG \
            | python3 -c "import json,sys;r=json.load(sys.stdin);print(next(a['browser_download_url'] for a in r['assets'] if a['name'].endswith('.apk')))")
          echo "tag=$TAG url=$URL"
          curl -sSL "$URL" -o app.apk
          ls -l app.apk
      - name: Compression + alignment of the two mandatory entries
        run: |
          python3 - <<'PY'
          import zipfile, struct
          z = zipfile.ZipFile('app.apk')
          print('%-34s %-10s %12s %12s %10s' % ('entry', 'method', 'offset', 'modhdr', 'align4'))
          for name in ('AndroidManifest.xml', 'resources.arsc'):
              if name not in z.namelist():
                  print(name, 'MISSING'); continue
              info = z.getinfo(name)
              # local header offset + 30 + length(name) + extra
              f = open('app.apk', 'rb')
              f.seek(info.header_offset)
              hdr = f.read(30)
              n, m = struct.unpack('<HH', hdr[26:30])
              data_off = info.header_offset + 30 + n + m
              method = {0: 'STORED', 8: 'DEFLATED'}.get(info.compress_type, str(info.compress_type))
              print('%-34s %-10s %12d %12d %10s' % (
                  name, method, data_off, data_off, 'OK' if data_off % 4 == 0 else 'MISALIGNED'))
          methods = {}
          for i in z.infolist():
              methods[i.compress_type] = methods.get(i.compress_type, 0) + 1
          print('compression methods used (0=STORED, 8=DEFLATED):', methods)
          print('total entries:', len(z.infolist()))
          PY
