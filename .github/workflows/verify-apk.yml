name: Verify Packaged APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK from the last successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --workflow build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "build run: $RUN"
          mkdir -p dist
          gh run download "$RUN" -D dist --pattern 'opss-*'
          find dist -name '*.apk' -exec ls -la {} \;

      - name: Confirm the file really is an installable APK
        run: |
          set -uo pipefail
          APK=$(find dist -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk to inspect"; exit 1; }
          file "$APK"
          unzip -t "$APK" | tail -2
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort | tail -1)
          "$AAPT" dump badging "$APK" > badging.txt
          grep -E "^package|^sdkVersion|^targetSdkVersion|^application-label:|^native-code" badging.txt
          echo "--- signature ---"
          "$ANDROID_HOME/build-tools/31.0.0/apksigner" verify --print-certs "$APK" > certs.txt 2>&1
          head -4 certs.txt
          echo "--- native libs (ABI) ---"
          unzip -l "$APK" | awk '/lib\// {split($4,a,"/"); print a[2]}' | sort -u
          echo "--- dex host scan ---"
          mkdir -p x && cd x && unzip -o -q "../$APK" 'classes*.dex'
          cat classes*.dex > all.dex
          for host in taxi.ecardo.ir alaadcin.com 192.168.1.141; do
            if grep -qa "$host" all.dex; then
              echo "FOUND    $host"
            else
              echo "absent   $host"
            fi
          done
          echo "--- webservice endpoints ---"
          grep -ao 'https\?://[a-zA-Z0-9./_-]*webservice_shark.php' all.dex | sort -u | head -5
          echo "(scan done)"
