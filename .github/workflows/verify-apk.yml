name: Verify APK

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest APK artifact
        run: |
          set -x
          ART=$(gh api /repos/$GITHUB_REPOSITORY/actions/artifacts --jq \
            '[.artifacts[] | select(.name | test("apk"))] | sort_by(.created_at) | last | .id')
          echo "artifact=$ART"
          gh run download -n apk-dist -D dist || \
          gh run download "$ART" -D dist
      - name: Describe the package
        run: |
          set -x
          APK=$(find dist -name '*.apk' | head -1)
          echo "APK=$APK"
          file "$APK"
          unzip -t "$APK" > /dev/null && echo "zip integrity OK" || echo "zip integrity FAIL"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)
          "$AAPT" dump badging "$APK" > badging.txt 2>&1 || true
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code)" badging.txt
          unzip -l "$APK" | grep -o 'lib/[a-z0-9_-]*/' | sort -u
          unzip -l "$APK" | grep -c 'META-INF/.*\.\(RSA\|SF\|MF\)' || true
      - name: Signature check
        run: |
          set -x
          APK=$(find dist -name '*.apk' | head -1)
          SIG=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner=$SIG"
          if [ -n "$SIG" ]; then "$SIG" verify --print-certs "$APK" || echo "APKSIGNER FAILED"; else echo "no apksigner"; fi
      - name: Scan the dex for the backend host
        run: |
          set -x
          APK=$(find dist -name '*.apk' | head -1)
          rm -rf dex && mkdir dex
          unzip -o -q "$APK" 'classes*.dex' -d dex || true
          ls -l dex
          for h in taxi.ecardo.ir alaadcin.com 192.168.1.141; do
            if grep -r -a -q "$h" dex; then echo "FOUND $h"; else echo "absent $h"; fi
          done
