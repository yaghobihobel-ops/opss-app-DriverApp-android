name: Verify APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (blank = latest)'
        required: false
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download the released APK
        run: |
          set -x
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -sS https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          fi
          echo "tag=$TAG"
          URL=$(curl -sS https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG \
            | python3 -c "import json,sys;r=json.load(sys.stdin);print(next(a['browser_download_url'] for a in r['assets'] if a['name'].endswith('.apk')))")
          echo "url=$URL"
          curl -sSL "$URL" -o app.apk
          ls -l app.apk
          file app.apk
      - name: Describe the package
        run: |
          set -x
          unzip -t app.apk > /dev/null && echo "zip integrity OK" || echo "zip integrity FAIL"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)
          "$AAPT" dump badging app.apk > badging.txt 2>&1 || true
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code)" badging.txt || true
          unzip -l app.apk | grep -o 'lib/[a-z0-9_-]*/' | sort -u || true
          echo "v1 signature entries:"
          unzip -l app.apk | grep -iE 'META-INF/.*\.(RSA|DSA|EC|SF)' || echo "NONE"
      - name: Signature check
        run: |
          set -x
          SIG=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner=$SIG"
          if [ -n "$SIG" ]; then
            "$SIG" verify --verbose --print-certs app.apk > sig.txt 2>&1 || true
            head -25 sig.txt
          else
            echo "apksigner not found"
          fi
      - name: Scan the dex for the backend host
        run: |
          set -x
          rm -rf dex && mkdir dex
          unzip -o -q app.apk 'classes*.dex' -d dex || true
          ls -l dex || true
          for h in taxi.ecardo.ir alaadcin.com 192.168.1.141; do
            if grep -r -a -q "$h" dex; then echo "FOUND $h"; else echo "absent $h"; fi
          done
