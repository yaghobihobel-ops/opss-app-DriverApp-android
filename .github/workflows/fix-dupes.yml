name: Fix Duplicate Classes

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to patch'
        required: false
        default: 'fix/stable'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Exclude the support-library modules that clash with AndroidX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # androidx.browser and com.android.support:customtabs both ship
          # android.support.customtabs.*, so only the old support module has to
          # go. Excluding the whole com.android.support group is not an option:
          # a bundled library (com.view.MTextView) still extends a support class.
          old = ("    configurations {\n"
                 "        all*.exclude group: 'com.squareup.okhttp', module: 'okhttp'\n"
                 "        all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp'\n"
                 "    }")
          new = ("    configurations {\n"
                 "        all*.exclude group: 'com.squareup.okhttp', module: 'okhttp'\n"
                 "        all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp'\n"
                 "        // androidx.browser already provides these classes; the old\n"
                 "        // support copies collide with it at dex time.\n"
                 "        all*.exclude group: 'com.android.support', module: 'customtabs'\n"
                 "        all*.exclude group: 'com.android.support', module: 'design'\n"
                 "        all*.exclude group: 'com.android.support', module: 'appcompat-v7'\n"
                 "    }")

          if "module: 'customtabs'" in s:
              print("already excluded")
          elif old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("excluded the clashing support modules")
          else:
              raise SystemExit("ERROR: configurations block not in the expected shape")
          PY
          sed -n '/configurations {/,/}/p' app/build.gradle

      - name: Check for duplicate classes
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:checkProdDebugDuplicateClasses --no-daemon > /tmp/dupes.log 2>&1
          echo "exit: $?"
          grep -E "Duplicate class" /tmp/dupes.log | sed -E 's/.*Duplicate class ([^ ]+).*/\1/' | sort -u | head -20
          grep -c "Duplicate class" /tmp/dupes.log || true

      - name: Commit
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git diff --cached --quiet || git commit -m "fix(gradle): exclude the support modules that clash with AndroidX"
          BRANCH="${{ inputs.branch }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH" 2>/dev/null; then
              echo "pushed to $BRANCH"; break
            fi
            git pull --rebase --autostash origin "$BRANCH"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done